<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>気象情報ダッシュボード</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary-color: #003366;
            --accent-color: #e67e22;
        }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; color: var(--primary-color); }
        
        .card { background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-title { font-size: 1.2rem; font-weight: bold; border-left: 5px solid var(--primary-color); padding-left: 10px; margin-bottom: 15px; }
        
        .overview-text { line-height: 1.6; white-space: pre-wrap; font-size: 0.95rem; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-item { text-align: center; padding: 10px; background: #f8f9fa; border-radius: 5px; }
        .stat-label { font-size: 0.8rem; color: #666; }
        .stat-value { font-size: 1.4rem; font-weight: bold; }
        .high { color: #d35400; }
        .low { color: #2980b9; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border-bottom: 1px solid #eee; padding: 12px 8px; text-align: center; }
        th { background-color: #f8f9fa; font-size: 0.9rem; }
        tr:hover { background-color: #fafafa; }
        
        .loading { text-align: center; padding: 50px; font-style: italic; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>気象ダッシュボード</h1>
        <p id="ref-time">データ取得中...</p>
    </header>

    <div class="card">
        <div class="card-title">天気概況 (石狩・空知・後志地方)</div>
        <div id="weather-overview" class="overview-text">読み込み中...</div>
    </div>

    <div class="card">
        <div class="card-title">本日の気温（アメダス札幌）</div>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">最高気温</div>
                <div id="temp-max" class="stat-value high">--.-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">最低気温</div>
                <div id="temp-min" class="stat-value low">--.-</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">アメダス 60分前までの推移</div>
        <table id="amedas-table">
            <thead>
                <tr>
                    <th>時刻</th>
                    <th>気温(℃)</th>
                    <th>降水(mm)</th>
                    <th>風速(m/s)</th>
                </tr>
            </thead>
            <tbody id="amedas-body">
                </tbody>
        </table>
    </div>
</div>

<script>
/**
 * 設定
 */
const STATION_ID = "14163"; // 札幌
const FORECAST_URL = "https://www.jma.go.jp/bosai/forecast/data/forecast/016000.json";
const AMEDAS_LATEST = "https://www.jma.go.jp/bosai/amedas/data/latest_time.json";

async function init() {
    try {
        await Promise.all([
            fetchForecast(),
            fetchAMeDAS()
        ]);
    } catch (e) {
        console.error("データ取得エラー:", e);
    }
}

/**
 * 天気概況を取得
 */
async function fetchForecast() {
    const res = await fetch(FORECAST_URL);
    const data = await res.json();
    
    // 気象庁のJSON構造から概況テキストを取得 (通常[0].reportDatetimeなどが含まれる)
    // 今回は提供されたURLに含まれる予報文言を抽出
    const overviewArea = data[0].timeSeries[0].areas[0];
    const weatherText = overviewArea.weathers ? overviewArea.weathers[0] : "概況データなし";
    
    document.getElementById('weather-overview').innerText = 
        `${data[0].publishingOffice}発表\n報告日時: ${new Date(data[0].reportDatetime).toLocaleString()}\n\n【天気予報】\n${weatherText}`;
}

/**
 * アメダスデータを取得
 */
async function fetchAMeDAS() {
    // 1. 最新のデータ時刻を取得
    const timeRes = await fetch(AMEDAS_LATEST);
    const latestJson = await timeRes.json();
    const latestDateStr = latestJson; // e.g. "20231027151000"
    
    // 日付部分を抽出 (YYYYMMDD)
    const datePart = latestDateStr.substring(0, 8);
    const amedasUrl = `https://www.jma.go.jp/bosai/amedas/data/point/${STATION_ID}/${datePart}.json`;

    // 2. その日の全データを取得
    const amedasRes = await fetch(amedasUrl);
    const amedasData = await amedasRes.json();

    // 3. データを整理
    const times = Object.keys(amedasData).sort().reverse(); // 最新順
    
    // 最高・最低気温の算出 (当日分)
    let maxTemp = -99;
    let minTemp = 99;
    for (let t in amedasData) {
        const val = amedasData[t].temp[0];
        if (val !== null) {
            if (val > maxTemp) maxTemp = val;
            if (val < minTemp) minTemp = val;
        }
    }
    document.getElementById('temp-max').innerText = maxTemp === -99 ? "--" : maxTemp.toFixed(1) + "℃";
    document.getElementById('temp-min').innerText = minTemp === 99 ? "--" : minTemp.toFixed(1) + "℃";

    // 4. 直近60分のテーブル作成 (10分おき 7件分)
    const tbody = document.getElementById('amedas-body');
    tbody.innerHTML = '';
    
    // 60分前までの時刻リストを作成
    for (let i = 0; i < 7; i++) {
        const currentTimeKey = getOffsetTimeKey(latestDateStr, i * 10);
        const record = amedasData[currentTimeKey];

        if (record) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${currentTimeKey.substring(8, 10)}:${currentTimeKey.substring(10, 12)}</td>
                <td>${record.temp[0] !== null ? record.temp[0].toFixed(1) : '--'}</td>
                <td>${record.precipitation10m[0] !== null ? record.precipitation10m[0].toFixed(1) : '0.0'}</td>
                <td>${record.wind[0] !== null ? record.wind[0].toFixed(1) : '--'}</td>
            `;
            tbody.appendChild(tr);
        }
    }
    
    document.getElementById('ref-time').innerText = `最終更新: ${latestDateStr.substring(8, 10)}時${latestDateStr.substring(10, 12)}分`;
}

/**
 * 基準時刻からN分前のキー(YYYYMMDDHHMMSS)を生成する補助関数
 */
function getOffsetTimeKey(baseStr, minutesOffset) {
    const year = baseStr.substring(0, 4);
    const month = baseStr.substring(4, 6) - 1;
    const day = baseStr.substring(6, 8);
    const hour = baseStr.substring(8, 10);
    const minute = baseStr.substring(10, 12);
    
    const date = new Date(year, month, day, hour, minute);
    date.setMinutes(date.getMinutes() - minutesOffset);
    
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    const hh = String(date.getHours()).padStart(2, '0');
    const mm = String(date.getMinutes()).padStart(2, '0');
    
    return `${y}${m}${d}${hh}${mm}00`;
}

init();
</script>

</body>
</html>
