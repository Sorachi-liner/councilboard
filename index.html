<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アメダス・天気概況ダッシュボード</title>
    <style>
        :root { --bg: #f5f7fa; --card: #ffffff; --primary: #2c3e50; --accent: #3498db; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--primary); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { font-size: 1.1rem; margin-top: 0; border-left: 4px solid var(--accent); padding-left: 10px; }
        .overview { line-height: 1.7; white-space: pre-wrap; font-size: 0.95rem; background: #f9f9f9; padding: 15px; border-radius: 8px; }
        .temp-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .temp-card { flex: 1; text-align: center; padding: 15px; border-radius: 8px; color: white; }
        .max { background: #e74c3c; }
        .min { background: #3498db; }
        .temp-val { font-size: 1.8rem; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-size: 0.85rem; }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>気象ダッシュボード</h1>
        <p id="update-time">データ取得中...</p>
    </header>

    <div class="card">
        <h2>天気概況</h2>
        <div id="weather-text" class="overview">読み込み中...</div>
    </div>

    <div class="temp-row">
        <div class="temp-card max">
            <div>最高気温 (60分間)</div>
            <div id="max-t" class="temp-val">--.-℃</div>
        </div>
        <div class="temp-card min">
            <div>最低気温 (60分間)</div>
            <div id="min-t" class="temp-val">--.-℃</div>
        </div>
    </div>

    <div class="card">
        <h2>アメダス (10分おき/直近60分)</h2>
        <table id="amedas-table">
            <thead>
                <tr>
                    <th>時刻</th>
                    <th>気温(℃)</th>
                    <th>降水(mm)</th>
                    <th>風速(m/s)</th>
                </tr>
            </thead>
            <tbody id="amedas-body">
                <tr><td colspan="4" class="loading">取得中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const STATION_NO = "14163"; // 札幌
const FORECAST_JSON = "https://www.jma.go.jp/bosai/forecast/data/forecast/016000.json";
const AMEDAS_BASE_URL = "https://api.cultivationdata.net/amds";

// 気象庁のデータは直接fetchするとCORSエラーになる場合があるため、プロキシを通すか検討が必要ですが
// まずは直接取得を試みます。
async function fetchWeather() {
    try {
        // 1. 天気概況の取得
        const fRes = await fetch(FORECAST_JSON);
        const fData = await fRes.json();
        const overview = fData[0].timeSeries[0].areas[0].weathers[0];
        document.getElementById('weather-text').innerText = overview;

        // 2. アメダスデータの取得 (直近60分 = 7回分)
        const now = new Date();
        const dataPoints = [];
        
        // 10分刻みの時間を7点分生成
        for (let i = 0; i < 7; i++) {
            const target = new Date(now.getTime() - (i * 10 * 60 * 1000));
            // 分を10分単位に切り捨て
            target.setMinutes(Math.floor(target.getMinutes() / 10) * 10);
            target.setSeconds(0);

            const ts = formatDT(target);
            dataPoints.push(ts);
        }

        // 全件並列でリクエスト
        const results = await Promise.all(dataPoints.map(dt => 
            fetch(`${AMEDAS_BASE_URL}?no=${STATION_NO}&dt=${dt}`).then(r => r.json())
        ));

        renderAmedas(results);

    } catch (e) {
        console.error(e);
        document.getElementById('weather-text').innerText = "データの取得に失敗しました。";
    }
}

function formatDT(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const h = String(d.getHours()).padStart(2, '0');
    const min = String(d.getMinutes()).padStart(2, '0');
    return `${y}${m}${day}${h}${min}`;
}

function renderAmedas(dataList) {
    const tbody = document.getElementById('amedas-body');
    tbody.innerHTML = '';
    
    let temps = [];

    dataList.forEach(item => {
        if (!item || !item.temp) return;
        
        const tr = document.createElement('tr');
        const timeStr = item.dt.substring(8,10) + ":" + item.dt.substring(10,12);
        
        tr.innerHTML = `
            <td>${timeStr}</td>
            <td>${item.temp}</td>
            <td>${item.prec}</td>
            <td>${item.wind}</td>
        `;
        tbody.appendChild(tr);
        temps.push(item.temp);
    });

    if (temps.length > 0) {
        document.getElementById('max-t').innerText = Math.max(...temps).toFixed(1) + "℃";
        document.getElementById('min-t').innerText = Math.min(...temps).toFixed(1) + "℃";
    }
    
    document.getElementById('update-time').innerText = "最終更新: " + new Date().toLocaleTimeString();
}

fetchWeather();
</script>
</body>
</html>
